version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: backhaul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-backhaul_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-backhaul_password}
      POSTGRES_DB: ${DATABASE_NAME:-backhaul_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-backhaul_user} -d ${DATABASE_NAME:-backhaul_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backhaul

  redis:
    image: redis:7-alpine
    container_name: backhaul_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backhaul

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: backhaul_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    networks:
      - backhaul

volumes:
  postgres_data:
  redis_data:

networks:
  backhaul:
    driver: bridge